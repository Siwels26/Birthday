<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --lilac: #E9DDFB;
    --pink: #FFC6DD;
    --peach: #FFE0D1;
    --hot: #FF7BAC;
    --purple: #9B6FD8;
    --ink: #4A2F6B;
    --white: #FFFFFF;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--lilac) 0%, var(--pink) 55%, var(--peach) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Welcome screen (starts the song) ---------- */
  .welcome {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: linear-gradient(160deg, var(--lilac), var(--pink));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    transition: opacity 0.9s ease;
  }
  .welcome.hide { opacity: 0; pointer-events: none; }
  .welcome .gift { font-size: 64px; animation: bob 1.6s ease-in-out infinite; }
  .welcome p {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    color: var(--ink);
  }
  .welcome button {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--white);
    background: var(--hot);
    border: none;
    padding: 14px 34px;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,123,172,0.45);
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* ---------- Balloons ---------- */
  .balloon-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .balloon {
    position: absolute;
    bottom: -220px;
    width: 64px;
    height: 80px;
    border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
    animation: float-up linear infinite;
    box-shadow: inset -8px -10px 16px rgba(0,0,0,0.08), inset 8px 8px 14px rgba(255,255,255,0.35);
  }
  .balloon::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 14px;
    width: 12px;
    height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    transform: rotate(25deg);
  }
  .balloon::after {
    content: '';
    position: absolute;
    bottom: -46px;
    left: 50%;
    width: 1.5px;
    height: 46px;
    background: rgba(74,47,107,0.35);
  }
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) rotate(-4deg); }
    50%  { transform: translateY(-58vh) translateX(26px) rotate(4deg); }
    100% { transform: translateY(-118vh) translateX(-18px) rotate(-4deg); }
  }

  /* ---------- Main ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 24px;
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(48px, 11vw, 92px);
    line-height: 1.05;
    color: var(--ink);
    text-shadow: 3px 3px 0 rgba(255,255,255,0.7);
    margin-bottom: 28px;
  }

  .photo-wrap {
    position: relative;
    width: clamp(200px, 48vw, 260px);
    height: clamp(200px, 48vw, 260px);
    margin: 0 auto;
  }
  .photo-wrap::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--hot), var(--purple), var(--pink), var(--peach), var(--hot));
    animation: spin 10s linear infinite;
  }
  .photo-wrap::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--white);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .photo {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    background: linear-gradient(135deg, var(--pink), var(--lilac));
  }
  /* Shown only if photo.jpg is missing */
  .photo-fallback {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    background: linear-gradient(135deg, var(--pink), var(--lilac));
  }

  .name {
    margin-top: 34px;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(52px, 13vw, 104px);
    line-height: 1.05;
    background: linear-gradient(100deg, var(--hot), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding: 0 10px;
  }

  .wish {
    margin-top: 10px;
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--ink);
    opacity: 0.8;
  }

  .hearts {
    margin-top: 16px;
    font-size: 22px;
    letter-spacing: 8px;
  }

  /* ---------- Music toggle ---------- */
  .music-toggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 6px 18px rgba(74,47,107,0.2);
    font-size: 22px;
    cursor: pointer;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  @media (prefers-reduced-motion: reduce) {
    .balloon, .photo-wrap::before, .welcome .gift { animation: none; }
  }
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="Chipmunks.mp3" type="audio/mpeg">
</audio>

<div class="welcome" id="welcome">
  <div class="gift">🎁</div>
  <p>A surprise for you</p>
  <button id="enterBtn">TAP TO OPEN</button>
</div>

<div class="balloon-field" id="balloonField"></div>
<canvas id="confettiCanvas"></canvas>

<main class="stage">
  <div class="title">Happy Birthday</div>

  <div class="photo-wrap">
    <div class="photo-fallback">🎀</div>
    <img class="photo" src="Salome.jpg" alt="Birthday girl" onerror="this.style.display='none'">
  </div>

  <div class="name">Salome</div>
  <div class="wish">Have the most beautiful day as you celebrate your birthday.</div>
  <div class="hearts">💖 🎈 💖</div>
</main>

<button class="music-toggle" id="musicToggle" title="Music">🔊</button>

<script>
// ---------- Balloons ----------
const colors = ['#FF7BAC', '#9B6FD8', '#FFB3D1', '#FFD27F', '#8FD8E8', '#C7A6F5'];
const field = document.getElementById('balloonField');
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div');
  b.className = 'balloon';
  b.style.background = colors[i % colors.length];
  b.style.left = (Math.random() * 94) + 'vw';
  b.style.animationDuration = (13 + Math.random() * 10) + 's';
  b.style.animationDelay = (Math.random() * 13) + 's';
  b.style.scale = (0.7 + Math.random() * 0.7);
  field.appendChild(b);
}

// ---------- Confetti (a quick burst when she opens it) ----------
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

let bits = [];
const confettiColors = ['#FF7BAC', '#9B6FD8', '#FFD27F', '#8FD8E8', '#FFFFFF'];

function burst(x, y, n = 140) {
  for (let i = 0; i < n; i++) {
    bits.push({
      x, y,
      vx: (Math.random() - 0.5) * 15,
      vy: -Math.random() * 15 - 3,
      g: 0.35 + Math.random() * 0.15,
      s: 5 + Math.random() * 6,
      c: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      r: Math.random() * 360,
      rs: (Math.random() - 0.5) * 12,
      life: 0,
      max: 120 + Math.random() * 50
    });
  }
}

function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  bits.forEach(p => {
    p.vy += p.g * 0.15;
    p.x += p.vx;
    p.y += p.vy;
    p.r += p.rs;
    p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.r * Math.PI / 180);
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  });
  bits = bits.filter(p => p.life < p.max);
  requestAnimationFrame(tick);
}
tick();

// ---------- Welcome screen starts the song ----------
const welcome = document.getElementById('welcome');
const bgMusic = document.getElementById('bgMusic');
const toggle = document.getElementById('musicToggle');
bgMusic.volume = 0.6;

let confettiTimer = null;

function startAutoConfetti() {
  if (confettiTimer) return; // don't start twice
  confettiTimer = setInterval(() => {
    const x = Math.random() * innerWidth;           // random spot across the screen
    const y = innerHeight * (0.2 + Math.random() * 0.4); // upper-middle area
    burst(x, y, 70);
  }, 2000); // every 2 seconds
}

document.getElementById('enterBtn').addEventListener('click', () => {
  bgMusic.play().catch(() => {});
  welcome.classList.add('hide');
  setTimeout(() => burst(innerWidth / 2, innerHeight / 2.5, 170), 350);
  startAutoConfetti();
});

 document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(confettiTimer);
    confettiTimer = null;
  } else if (!welcome.classList.contains('hide')) {
    return; // welcome screen still showing, don't start yet
  } else {
    startAutoConfetti();
  }
});

toggle.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {});
    toggle.textContent = '🔊';
  } else {
    bgMusic.pause();
    toggle.textContent = '🔇';
  }
});
</script>

</body>
</html>
